name: Build EDULOCK Player

on:
  push:
    paths:
      - 'player-app/**'
      - '.github/workflows/build-player.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (ej: 1.1.0)'
        required: false
        default: ''

jobs:
  # ─── macOS (Intel + Apple Silicon) ────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: player-app/package-lock.json

      - name: Instalar dependencias
        working-directory: player-app
        run: npm ci

      - name: Descargar binario de Electron (castlabs Widevine)
        working-directory: player-app
        run: |
          node node_modules/electron/install.js
          if [ ! -d "node_modules/electron/dist/Electron.app" ]; then
            echo "ERROR: el binario de Electron (castlabs) no se descargó."; exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_GET_USE_PROXY: 'true'

      - name: Compilar para macOS (x64 + arm64)
        working-directory: player-app
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Sin firma de código (no tenemos certificado Apple)
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Subir artefacto macOS
        uses: actions/upload-artifact@v4
        with:
          name: EDULOCK-Player-macOS
          path: |
            player-app/dist/*.dmg
          retention-days: 30

  # ─── Linux (AppImage) ──────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: player-app/package-lock.json

      - name: Instalar dependencias del sistema (icono)
        run: sudo apt-get install -y libopenjp2-tools

      - name: Instalar dependencias npm
        working-directory: player-app
        run: npm ci

      - name: Descargar binario de Electron (castlabs Widevine)
        working-directory: player-app
        run: |
          node node_modules/electron/install.js
          if [ ! -f "node_modules/electron/dist/electron" ]; then
            echo "ERROR: el binario de Electron (castlabs) no se descargó."; exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_GET_USE_PROXY: 'true'

      - name: Compilar para Linux (AppImage)
        working-directory: player-app
        run: npm run build:linux
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: EDULOCK-Player-Linux
          path: |
            player-app/dist/*.AppImage
          retention-days: 30

  # ─── Windows (ya compila local, pero también en CI) ────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: player-app/package-lock.json

      - name: Instalar dependencias
        working-directory: player-app
        run: npm ci

      - name: Descargar binario de Electron (castlabs Widevine)
        working-directory: player-app
        shell: bash
        run: |
          node node_modules/electron/install.js
          if [ ! -f "node_modules/electron/dist/electron.exe" ]; then
            echo "ERROR: el binario de Electron (castlabs) no se descargó."; exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_GET_USE_PROXY: 'true'

      - name: Compilar para Windows (NSIS + Portable)
        working-directory: player-app
        run: npm run build:win
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: EDULOCK-Player-Windows
          path: |
            player-app/dist/*.exe
          retention-days: 30
