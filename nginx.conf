# =============================================================================
#  nginx.conf — Configuración de Nginx para Edulock Systems
#
#  Instalación (solo la 1ª vez):
#    sudo cp nginx.conf /etc/nginx/sites-available/reproductor
#    sudo ln -sf /etc/nginx/sites-available/reproductor /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  SSL (después de que el dominio apunte a la IP de esta VPS):
#    sudo certbot --nginx -d edulocksystemsoficial.dpdns.org
#
#  IMPORTANTE: este archivo es SOLO-HTTP a propósito. Certbot, al correr,
#  AÑADE automáticamente el bloque `listen 443 ssl`, los certificados y la
#  redirección HTTP→HTTPS. No pongas aquí `listen 443 ssl` a mano: sin
#  certificados nginx no arranca ("no ssl_certificate is defined").
#  El script _redeploy_vps.sh NO sobreescribe esta config si ya existe en el
#  servidor, para no borrar lo que añadió certbot.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name edulocksystemsoficial.dpdns.org;

    # Certbot usa esta ruta para validar el dominio (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- Seguridad básica ---
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # --- Tamaño máximo de subida (para videos grandes) ---
    client_max_body_size 20G;
    client_body_timeout 300s;

    # --- Timeout para procesar videos largos ---
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    # --- Logs ---
    access_log /var/log/nginx/reproductor-access.log;
    error_log  /var/log/nginx/reproductor-error.log;

    # --- Archivos estáticos: Nginx los sirve directamente (más rápido) ---
    location /js/ {
        alias /opt/reproductor/public/js/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # --- Media (manifest /api/r y segmentos /api/b): streaming sin buffering ---
    #     El cifrado AES-128 se hace en streaming en Node; con proxy_buffering
    #     activo nginx acumularía el segmento entero en memoria y anularía ese
    #     diseño. Estas son las rutas REALES (la antigua /api/proxy/segment/ ya
    #     no existe). Fix del PDF (Mejora 2 / P1).
    location ~ ^/api/(r|b)/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;         # streaming: no acumular en memoria
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # --- Todo lo demás va al servidor Node.js ---
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
