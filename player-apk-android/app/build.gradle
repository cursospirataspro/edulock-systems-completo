plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
}

android {
    namespace 'com.edulock.player'
    compileSdk 34

    defaultConfig {
        applicationId 'edulock.systemsoficial.com'
        minSdk 24
        targetSdk 34
        versionCode 115
        versionName '1.1.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Firma de release. La keystore (keystore.jks) NO se versiona (.gitignore).
    // Las credenciales se leen, en orden de prioridad, de:
    //   1) archivo externo indicado por EDULOCK_SIGNING_PROPERTIES (solo release)
    //   2) propiedad de proyecto -PKEYSTORE_PASSWORD / -PKEYSTORE_ALIAS
    //   3) variables de entorno KEYSTORE_PASSWORD / KEYSTORE_ALIAS
    // Solo se activa si la keystore existe, de modo que builds de debug/CI sin
    // keystore sigan funcionando.
    def ksProps = new Properties()
    def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    def signingPath = System.getenv('EDULOCK_SIGNING_PROPERTIES')
    if (releaseRequested && signingPath) { file(signingPath).withInputStream { ksProps.load(it) } }

    def keystoreFile = rootProject.file(ksProps.getProperty('storeFile') ?: 'keystore.jks')
    def keystorePass = (ksProps.getProperty('storePassword')
        ?: project.findProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD'))
    def keystoreAlias = (ksProps.getProperty('keyAlias')
        ?: project.findProperty('KEYSTORE_ALIAS') ?: System.getenv('KEYSTORE_ALIAS') ?: 'edulock')
    def keyPass = (ksProps.getProperty('keyPassword') ?: keystorePass)
    def hasKeystore = keystoreFile.exists() && keystorePass

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile keystoreFile
                storePassword keystorePass
                keyAlias keystoreAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            buildConfigField "boolean", "DEBUG_LOGGING", "false"
        }
        debug {
            minifyEnabled false
            debuggable true
            buildConfigField "boolean", "DEBUG_LOGGING", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.23'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Media/HLS Player
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'

    // Security (usando EncryptedSharedPreferences de AndroidX)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // JWT
    implementation 'com.auth0:java-jwt:4.4.0'

    // Firebase
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'com.google.firebase:firebase-auth:22.3.1'

    // Play Integrity (hardware attestation)
    implementation 'com.google.android.play:integrity:1.4.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Local Storage
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
