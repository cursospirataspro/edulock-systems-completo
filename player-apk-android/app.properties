# EDULOCK Player - Configuración de API

# URL del servidor (cambiar según ambiente)
API_BASE_URL=https://edulocksystemsoficial.dpdns.org/

# Timeout de conexión (segundos)
CONNECTION_TIMEOUT=15
READ_TIMEOUT=30
WRITE_TIMEOUT=30

# Configuración de seguridad
ENABLE_SSL_PINNING=false
DEBUG_LOGGING=false

# Configuración de DRM
DRM_TYPE=widevine

# Configuración de marca de agua
WATERMARK_OPACITY=0.3
WATERMARK_SIZE=12
